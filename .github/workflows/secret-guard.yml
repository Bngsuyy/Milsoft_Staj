name: Secret guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-tracked-files:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Scan tracked text files without printing secret values
        shell: pwsh
        run: ./scripts/Test-TrackedSecrets.ps1
